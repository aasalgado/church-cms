AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: SAM template for Sprint 4.4 read-only CMS API and Sprint 4.5 Cognito infrastructure (do not deploy without review).

Parameters:
  CognitoDomainPrefix:
    Type: String
    Description: Globally unique lowercase Cognito hosted-login domain prefix
    MinLength: 1
    MaxLength: 63
    AllowedPattern: '^([a-z0-9]|[a-z0-9][a-z0-9-]{0,61}[a-z0-9])$'

  CognitoCallbackUrl:
    Type: String
    Description: OAuth 2.0 authorization callback URL
    Default: http://localhost:3000/auth/callback

  CognitoLogoutUrl:
    Type: String
    Description: OAuth 2.0 logout callback URL
    Default: http://localhost:3000/

Globals:
  Function:
    Timeout: 10
    MemorySize: 256

Resources:
  CmsContentTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: CmsContent
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: sectionId
          AttributeType: S
      KeySchema:
        - AttributeName: sectionId
          KeyType: HASH

  CmsAdminUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: cms-admin-users
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      MfaConfiguration: "OFF"
      DeletionProtection: INACTIVE
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true

  CmsAdminUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: cms-admin-nextjs
      UserPoolId: !Ref CmsAdminUserPool
      GenerateSecret: false
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows:
        - code
      AllowedOAuthScopes:
        - openid
        - email
        - profile
      CallbackURLs:
        - !Ref CognitoCallbackUrl
      LogoutURLs:
        - !Ref CognitoLogoutUrl
      SupportedIdentityProviders:
        - COGNITO
      EnableTokenRevocation: true
      PreventUserExistenceErrors: ENABLED
      AccessTokenValidity: 60
      IdTokenValidity: 60
      RefreshTokenValidity: 30
      TokenValidityUnits:
        AccessToken: minutes
        IdToken: minutes
        RefreshToken: days
      ExplicitAuthFlows:
        - ALLOW_REFRESH_TOKEN_AUTH

  CmsAdminUserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Ref CognitoDomainPrefix
      UserPoolId: !Ref CmsAdminUserPool

  CmsAdminGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: cms-admin
      Description: Administrators authorized to manage CMS content
      UserPoolId: !Ref CmsAdminUserPool
      Precedence: 1

  ContentReadFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: content-read-function
      Handler: handler.handler
      Runtime: nodejs24.x
      CodeUri: ../services/content-read/dist/
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:BatchGetItem
              Resource: !GetAtt CmsContentTable.Arn
      Environment:
        Variables:
          TABLE_NAME: !Ref CmsContentTable

  ContentApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: dev
      Name: cms-content-api
      DefinitionBody:
        openapi: 3.0.1
        info:
          title: CMS Content API
          version: 1.0.0
        paths:
          /content:
            get:
              x-amazon-apigateway-integration:
                uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ContentReadFunction.Arn}/invocations
                passthroughBehavior: WHEN_NO_MATCH
                httpMethod: POST
                type: aws_proxy
          /content/{sectionId}:
            get:
              parameters:
                - name: sectionId
                  in: path
                  required: true
                  schema:
                    type: string
              x-amazon-apigateway-integration:
                uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ContentReadFunction.Arn}/invocations
                passthroughBehavior: WHEN_NO_MATCH
                httpMethod: POST
                type: aws_proxy

  ContentReadFunctionPermissionContent:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref ContentReadFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${ContentApi}/*/GET/content

  ContentReadFunctionPermissionContentById:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref ContentReadFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${ContentApi}/*/GET/content/*

Outputs:
  ApiUrl:
    Description: "API base URL (invoke after deploy)"
    Value: !Sub "https://${ContentApi}.execute-api.${AWS::Region}.amazonaws.com/dev"
  TableName:
    Description: "CmsContent table name"
    Value: !Ref CmsContentTable
  CmsAdminUserPoolId:
    Description: Cognito User Pool ID for CMS administrators
    Value: !Ref CmsAdminUserPool
  CmsAdminAppClientId:
    Description: Cognito app client ID for CMS administrators
    Value: !Ref CmsAdminUserPoolClient
  CmsAdminHostedLoginDomain:
    Description: Cognito hosted-login domain
    Value: !Sub "https://${CognitoDomainPrefix}.auth.${AWS::Region}.amazoncognito.com"
